---
# By default any settings is defined for Russia because I'm Russian
# Necessary network variables.
common_ip4_default: "127.0.0.1" # must be changed
common_short_hostname: "myhost" # must be changed
common_domain_name: "example.com" # must be changed
common_full_hostname: # may be "{{ common_short_hostname }}.{{ common_domain_name }}"
# directories for role templates and variables
common_templates_path: "{{ role_path }}/templates"
common_etc_templates_path: "{{ common_templates_path }}"
common_init_templates_path: "{{ common_templates_path }}/systemd"
common_vars_dir: "{{ role_path }}/vars"

# sudo settings for local ops user
common_sudoers_dir: "/etc/sudoers.d"
common_ops_uid: # 1000
common_ops_user: # "admin"
common_sudo_group: # "wheel" in many distros but "sudo" on debian
common_sudo_groups:
#  - name: "{{ common_sudo_group }}"
#    gid: # 10 for wheel group, 27 for sudo on Debian
#  - name: "{{ common_ops_user }}"
#    gid: "{{ common_ops_uid }}"

# any SSL variables
common_own_ssl_ca: false
common_country_name: "RU"
common_ssl_owner_email_address: "admin@example.com"
common_ssl_common_name: "{{ common_domain_name }}"
# common_organization_name: # this variable is not necessary
# common_ssl_locality_name: # this variable is not necessary
# common_ssl_subject_alt_name: # this variable is not necessary, but recomended
common_ssl_private_keys_dir: "/etc/ssl/private"
common_ssl_certs_dir: "/etc/ssl/certs"
common_ssl_cs_path: "ssl-certs"
common_ssl_ca_pkey: "{{ common_ssl_private_keys_dir }}/{{ common_domain_name }}-ca-private.pem"
common_ssl_ca_csr: "{{ common_ssl_private_keys_dir }}/{{ common_domain_name }}-ca-private.csr"
common_ssl_ca_cert: "{{ common_ssl_certs_dir }}/{{ common_domain_name }}-ssl-ca.pem"
common_ssl_ca_host:
common_ssl_keys:
#  - cname:
#    pkey:
#    csr:
#    cert:
common_ssl_ca_domains:

# Locale and language settings
# list of needed locales
common_locales_list:
#  - locale: "en_US"
#    encoding: "ISO-8859-1"
#  - locale: "en_US.UTF-8"
#    encoding: "UTF-8"
#  - locale: "ru_RU.KOI8-R"
#    encoding: "KOI8-R"
#  - locale: "ru_RU.UTF-8"
#    encoding: "UTF-8"
#  - locale: "ru_RU.CP1251"
#    encoding: "CP1251"
# list of language settings
common_lang_settings:
#  - config_path: "/etc/locale.conf"
#    comment: |
#      # File /etc/locale.conf is managed by ansible.
#      # You shouldn't edit it manually!
#    lang_settings:
#      - name: 'LC_ALL'
#        value: ''
#      - name: 'LANG'
#        value: 'ru_RU.UTF-8'
#      - name: 'LC_MESSAGES'
#        value: 'en_US.UTF-8'
# list of console font and keyboard settings
common_kbd_n_cfont_settings: []
#  - name: 'KEYMAP'
#    value: 'ru1'
#  - name: 'FONT'
#    value: 'Cyr_a8x16'
#  - name: 'FONT_MAP'
#    value: 'cp866_to_uni'

# Network settings
common_network_manager: 'dhcp'
common_nm_connections: []
# DNS resolver settings
common_resolver_packages:
#  - "systemd-resolved"
common_resolver_config: "/etc/systemd/resolved.conf"
common_resolver: 'systemd-resolved'
common_dns: "192.168.1.1"
common_domains: "{{ common_domain_name }}"
common_resolver_params:
  - name: "DNS"
    value: "{{ common_dns }}"
  - name: "Domains"
    value: "{{ common_domain_name }}"

# Time sync parameters
common_timesync_packages: # ["systemd-timesyncd"]
common_time_config_path: "/etc/systemd/timesyncd.conf"
common_timesync_params:
  - name: "NTP"
    value: "0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org"
common_timesync_service: "systemd-timesyncd"
common_timezone: "Europe/Moscow"

# Any system configs settings
# local_store is used for store any files: certs, keys etc
# in future central store will be moved from filesystemd to other storage type
common_central_store: "/opt/common_central_store"
common_efi_mountpoint:
common_config_dirs: {}
