---
- name: Check if ansible version is equal or greater than 2.11
  when: ansible_version.full is ansible.builtin.version('2.11','<')
  tags:
    - always
  ansible.builtin.fail:
    msg: "Ansible core should be equal or greater than 2.11"

- name: Check if python is equal or greater than 3
  when: ansible_python.version.major is ansible.builtin.version('3','<')
  tags:
    - always
  ansible.builtin.fail:
    msg: "Python should be equal or greater than 3"

- name: Check if common_domain_name is defined
  tags:
    - always
  ansible.builtin.assert:
    that:
      - common_domain_name is defined
      - common_domain_name is not none
      - common_domain_name != "example.com"
    fail_msg: |
      common_domain_name: "{{ common_domain_name | default('empty') }}" is wrong.

- name: Set common_ip4_default variable
  when: not common_ip4_default is defined or common_ip4_default == "127.0.0.1"
  tags:
    - always
  ansible.builtin.set_fact:
    common_ip4_default: "ansible_default_ipv4['address']"
- name: Set host names
  tags:
    - always
  block:
    - name: Set short name
      when: not common_short_hostname is defined or common_short_hostname == "myhost"
      ansible.builtin.set_fact:
        common_short_hostname: "{{ ansible_fqdn.split('.')[0] }}"
    - name: Set full name
      when: not common_full_hostname is defined or common_full_hostname == "myhost.example.com"
      block:
        - name: Set full name from ansible_fqdn
          when: ansible_fqdn.split('.')[1] is defined
          ansible.builtin.set_fact:
            common_full_hostname: "{{ ansible_fqdn }}"
        - name: Set full hostname as common_short_hostname.common_domain_name
          when: not ansible_fqdn.split('.')[1] is defined
          ansible.builtin.set_fact:
            common_full_hostname: "{{ common_short_hostname }}.{{ common_domain_name }}"
      
- name: Check network variables is defined and correct
  tags:
    - always
  ansible.builtin.assert:
    that:
      - common_ip4_default is defined
      - common_ip4_default is not none
      - common_ip4_default != "127.0.0.1"
      - common_short_hostname is defined
      - common_short_hostname is not none
      - common_short_hostname != "myhost"
      - common_full_hostname is defined
      - common_full_hostname is not none
      - common_full_hostname | length > 0
    fail_msg: |
      Any of necessary variables:
        - common_ip4_default: "127.0.0.1" # must be changed
        - common_short_hostname: "myhost" # must be changed
        - common_domain_name: "example.com" # must be changed
        - common_full_hostname: "{{ common_short_hostname }}.{{ common_domain_name }}"
      is wrong
