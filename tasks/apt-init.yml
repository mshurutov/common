---
- name: Init repos
  tags: apt_init,apt_set_system_repos
  ansible.builtin.import_tasks: apt-repo-add.yml

# - name: Update packages cache
#   tags: apt_init,apt_update_cache,apt_set_system_repos
#   ansible.builtin.apt:
#     update_cache: true

- name: Upgrade system to latest version of pakackes
  tags: apt_init,apt_upgrade_system
  ansible.builtin.apt:
    name: '*'
    state: 'latest'
    only_upgrade: true

- name: Upgrade system to new release
  when: apt_upgrade_force is defined and apt_upgrade_force | bool
  tags: apt_init,apt_upgrade_release
  block:
    - name: Dist upgrade
      ansible.builtin.apt:
        force_apt_get: true
        upgrade: 'dist'
    - name: Full upgrade
      ansible.builtin.apt:
        force_apt_get: true
        upgrade: 'full'

- name: Install system packages
  tags: apt_init,system_install
  ansible.builtin.apt:
    name: "{{ apt_system_packages }}"

- name: Set python3 default interpreter
  tags: set_python
  community.general.alternatives:
    name: "python"
    link: "/usr/bin/python"
    path: "{{ item.path }}"
    priority: "{{ item.priority }}"
    state: "{{ item.state }}"
  loop: "{{ apt_python }}"
