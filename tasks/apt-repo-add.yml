---
- name: Remove old apt source files
  become: true
  become_user: root
  tags: apt_init,add_repo,apt_old_source_files
  block:
    - name: Remove /etc/apt/sources.list
      ansible.builtin.file:
        path: "/etc/apt/sources.list"
        state: absent
    - name: Remove *.list files from /etc/apt/sources.list.d/
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_fileglob: '/etc/apt/sources.list.d/*.list'
  
- name: Add apt repos
  become: true
  become_user: root
  when:
    apt_repo_list is defined
    and not apt_repo_list is none
    and apt_repo_list | length > 0
  tags: apt_init,add_repo
  block:
    - name: Add repos gpg key
      when: item.gpg_key is defined and item.gpg_key | length > 0
      tags: repo_gpg_key
      ansible.builtin.apt_key:
        url: "{{ item.gpg_key }}"
        state: present
        keyring: "{{ item.gpg_keyring | default(omit) }}"
      loop: "{{ apt_repo_list }}"
    - name: Add repos for apt
      ansible.builtin.template:
        dest: "/etc/apt/sources.list.d/{{ arl.filename | default(ansible_distribution) | lower }}.sources"
        mode: "0644"
        src: "{{ common_templates_path }}/apt.sources.j2"
      loop: "{{ apt_repo_list }}"
      loop_control:
        loop_var: arl
    - name: Update packages cache
      tags: apt_update_cache
      ansible.builtin.apt:
        update_cache: true
